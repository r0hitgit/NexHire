spring.application.name=job-portal-backend

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/jobportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:root}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.generate-ddl=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

server.port=${PORT:10000}
brevo.api.key=${BREVO_API_KEY:test_key}

# Cloudinary
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:test_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:test_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:test_secret}

# Google OAuth
google.client.id=${GOOGLE_CLIENT_ID:}
# Connection pool optimization
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.idle-timeout=300000

# Compression
server.compression.enabled=true
server.compression.mime-types=application/json,application/xml,text/html,text/plain
server.compression.min-response-size=1024